spring:
  application:
    name: employee-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/employeedb
    username: postgres
    password: ${DB_PASSWORD:1230}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,prometheus
  tracing:
    sampling:
      probability: 1.0

app:
  welcome-message: Welcome to Employee Service!
  # M4b: auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: ${JWT_SECRET:worktrack-dev-secret-key-please-change-in-production-0123456789}

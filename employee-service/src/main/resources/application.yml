spring:
  application:
    name: employee-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/employeedb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 0
      properties:
        max.block.ms: 2000
        request.timeout.ms: 1000

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # M1: actuator runs on its own internal port -- the public app port serves no
  # actuator at all. Keep this port off the public network / gateway in production.
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
  tracing:
    sampling:
      probability: 1.0

app:
  welcome-message: Welcome to Employee Service!
  # M4b: auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: ${JWT_SECRET}

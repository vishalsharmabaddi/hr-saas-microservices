spring:
  application:
    name: project-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/project_db
    username: postgres
    password: ${DB_PASSWORD:1230}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 0
      properties:
        max.block.ms: 2000
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # M1: actuator runs on its own internal port -- the public app port serves no
  # actuator at all. Keep this port off the public network / gateway in production.
  server:
    port: 9085
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
  tracing:
    sampling:
      probability: 1.0

app:
  welcome-message: Welcome to Project Service!
  # Our own JWT is signed with this secret (HS256 needs at least 32 bytes).
  # H3: no default on purpose -- if JWT_SECRET is unset the service must fail to start
  # rather than silently fall back to the old value that was committed to git.
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 ghante
  # Platform Console (cross-tenant) sirf in owner emails ko dikhega. Comma-separated. Prod me env se.
  platform:
    owner-emails: ${PLATFORM_OWNER_EMAILS:vishalsharmabaddi@gmail.com}

# M2: Google login token verify karte waqt "audience" isi client-id se match hoga.
# (Ye public value hai — frontend .env wale VITE_GOOGLE_CLIENT_ID jaisi.)
google:
  client-id: 1026168338724-p891oi1soa6pgjl9hfec6q6b046mv55k.apps.googleusercontent.com

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo

server:
  port: 8888

encrypt:
   key: ${ENCRYPT_KEY}

management:
  # M1: actuator runs on its own internal port -- keep it off the public network.
  server:
    port: 9888
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
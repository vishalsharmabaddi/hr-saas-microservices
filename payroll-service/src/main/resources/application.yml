spring:
  application:
    name: payroll-service
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    # Host se connect: Kafka ka HOST listener 29092 hai (9092 andar 'kafka:9092' advertise karta hai)
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8087

management:
  # M1: actuator runs on its own internal port -- the public app port serves no
  # actuator at all. Keep this port off the public network / gateway in production.
  server:
    port: 9087
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: payroll-service
    description: HR SaaS - Payroll / Payslip Service
    version: 1.0.0

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/

app:
  employee-service-url: http://localhost:8081
  attendance-service-url: http://localhost:8082
  leave-service-url: http://localhost:8083
  # auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: ${JWT_SECRET}

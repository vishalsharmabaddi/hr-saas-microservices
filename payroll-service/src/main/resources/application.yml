spring:
  application:
    name: payroll-service
  config:
    import: optional:configserver:http://localhost:8888
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: payroll-service
    description: HR SaaS - Payroll / Payslip Service
    version: 1.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  employee-service-url: http://localhost:8081
  attendance-service-url: http://localhost:8082
  leave-service-url: http://localhost:8083
  # auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: worktrack-dev-secret-key-please-change-in-production-0123456789

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  kafka:
    # Host se connect: Kafka ka HOST listener 29092 hai (9092 andar 'kafka:9092' advertise karta hai)
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: notification-service
    description: HR SaaS - Notification Service
    version: 1.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.hrsaas.notification_service: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  # M4b: auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: worktrack-dev-secret-key-please-change-in-production-0123456789
  # Phase 2: invite email me jo accept-link jaayega uska base (frontend URL)
  frontend-url: http://localhost:5173
  mail:
    from: WorkTrack <no-reply@worktrack.local>

# ── Phase 2 SMTP (real email) ──

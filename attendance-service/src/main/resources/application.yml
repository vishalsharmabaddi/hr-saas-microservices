spring:
  application:
    name: attendance-service
  config:
    import: optional:configserver:http://localhost:8888
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

management:
  # M1: actuator runs on its own internal port -- the public app port serves no
  # actuator at all. Keep this port off the public network / gateway in production.
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: attendance-service
    description: HR SaaS - Attendance Management Service
    version: 1.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  employee-service-url: http://localhost:8081
  # M4b: auth-service jis secret se token sign karti hai, wahi secret yahan verify ke liye
  jwt:
    secret: ${JWT_SECRET:worktrack-dev-secret-key-please-change-in-production-0123456789}
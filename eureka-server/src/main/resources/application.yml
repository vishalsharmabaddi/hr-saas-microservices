server:
  port: 8761

spring:
  application:
    name: eureka-server
  # M7: Basic-auth credentials for the registry/dashboard. Env-backed, no default --
  # if either is unset the server fails to start rather than running open (see H1/H3).
  security:
    user:
      name: ${EUREKA_USER}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 3000